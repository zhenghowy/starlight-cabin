# 名字若已被占用，改成你自己的，并在命令里使用同一个 app 名。
app = "starlight-cabin"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "cabin_data"
  destination = "/app/data"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/app/data"
  COOKIE_SECURE = "1"
  MAX_USERS = "20"
